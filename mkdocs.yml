site_name: Banco de Dados — Relacional (IBD015) — 2026/2
site_description: Material de aulas, atividades e avaliações de Banco de Dados — Relacional (IBD015) — Fatec Jahu — DSM — 2º Semestre 2026
site_url: https://dsm-fatec-jahu.github.io/BDR-DSM-2026-2/
repo_url: https://github.com/DSM-Fatec-Jahu/BDR-DSM-2026-2
repo_name: DSM-Fatec-Jahu/BDR-DSM-2026-2
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - tables
  - toc:
      permalink: true

# Mermaid é carregado com versão fixa (não a tag flutuante "@11" que o Material usa por
# padrão) para garantir que todo visitante renderize o mesmo build — a tag flutuante já
# causou divergência de renderização entre GitHub Pages e a pré-visualização do GitHub
# (pé de galinha sobreposto às tabelas em erDiagram de auto-relacionamento). Ver
# docs/javascripts/mermaid.mjs. Ao atualizar, teste o diagrama de auto-relacionamento da
# Aula 01 antes de trocar a versão.
extra_javascript:
  - javascripts/mermaid.mjs

plugins:
  - search:
      lang: pt
  - mkdocs_quiz

# IMPORTANTE: o nav é explícito (não há discovery automático de arquivos).
# Toda aula nova adicionada em docs/aulas/ precisa ganhar uma entrada aqui,
# na seção correta, ou ela existirá como arquivo mas não aparecerá no site.
# O pipeline descrito em CLAUDE.md cobre esse passo automaticamente.
nav:
  - Início: index.md
  - Bloco 1 — Fundamentos e Modelagem:
      - aulas/Aula_01_Revisao_Modelagem_Conceitual.md
      - aulas/Cardinalidade_MER_Completo.md
      - aulas/Aula_02_Normalizacao.md
      - aulas/Aula_03_SQL_DDL.md
  - Atividades e Avaliações:
      - atividades/index.md

extra:
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:ronan.zenatti@cps.sp.gov.br
